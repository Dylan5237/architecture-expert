# Stage 7 relationship map
# Machine-readable. Compact relation vocabulary only.
# Node IDs and paths must resolve. Edges are claims.
version: 1
stage: 7
node_classes:
  RUNTIME_KNOWLEDGE:
    - mother-principle
    - failure-pattern
    - tactic
    - good-case
  NAVIGATION_VIEW:
    - domain
  REFERENCE_ONLY:
    - evaluation-axiom
    - historical-candidate
    - review-signal-lineage
    - gap
    - source
  RETIRED_TOMBSTONE:
    - retired-reserved
predicates:
  DERIVED_FROM:
    from: [MP]
    to: [P, retired]
    direction: directed
    symmetric: false
    transitive: false
    causal: false
    evidence_inheritance: false
    semantics: lineage
    meaning: historical or reduction lineage; does not copy evidence
  EXPLAINS:
    from: [MP]
    to: [FP]
    direction: directed
    symmetric: false
    transitive: false
    causal: true
    evidence_inheritance: false
    semantics: violation-causes-failure
    meaning: MP explains FP causal family
  MITIGATED_BY:
    from: [FP]
    to: [T]
    direction: directed
    symmetric: false
    transitive: false
    causal: true
    evidence_inheritance: false
    semantics: intervention
    meaning: FP is addressed by tactic; not a guarantee of sufficiency
  RELATED_TO:
    from: [MP, FP, T, P]
    to: [MP, FP, T]
    direction: undirected
    symmetric: true
    transitive: false
    causal: false
    evidence_inheritance: false
    note_required: true
    semantics: navigation-only
    meaning: non-parent navigation; no evidence inheritance
  DISTINCT_FROM:
    from: any
    to: any
    direction: undirected
    symmetric: true
    transitive: false
    causal: false
    evidence_inheritance: false
    note: discriminator required
    semantics: independently-violable
    meaning: must remain independently diagnosable
  EVIDENCED_BY:
    from: [MP, FP]
    to: [S]
    direction: directed
    symmetric: false
    transitive: false
    causal: false
    evidence_inheritance: false
    semantics: direct-citation
    meaning: sparse load-bearing source; full lists live on atomic pages
  HAS_GOOD_CASE:
    from: [MP, FP, T, P]
    to: [GC]
    direction: directed
    symmetric: false
    transitive: false
    causal: false
    evidence_inheritance: false
    semantics: non-violation-boundary
    meaning: accepted non-violation boundary
  HAS_GAP:
    from: [MP]
    to: [RQ]
    direction: directed
    symmetric: false
    transitive: false
    causal: false
    evidence_inheritance: false
    semantics: open-gap
    meaning: open RQ; do not fill by invention
notes:
- 'OPERATIONALIZED_BY is omitted: review-signals/RS-* type is not instantiated.'
- MP-011 is a retired-reserved node only; no causal edges.
- AX-005 is not a node (usage-rule; ID reserved).
- Every edge is a claim. Sibling MPs do not inherit evidence.
- REFERENCE_ONLY and RETIRED_TOMBSTONE nodes are graph endpoints for lineage/evidence/gap validation and are not default runtime load targets.
- Router and relationship edges remain infrastructure, not knowledge node types.
