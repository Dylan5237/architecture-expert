tag_semantics:
  category: One exclusive primary holdout stress category per case; orthogonal tags may overlap.
  strict_goodcase: A designated materially compliant form; its material false positives enter frozen pass criterion
    5.
  partial_nonalarm: A limited compliant component within a case that still needs correction.
  ambiguity: Object/route or decision-changing missing evidence, not mere lack of every conceivable detail.
  product_contract_surface: Designated authority/accepted-guarantee stress cases; this tag does not decide D7 applicability
    for other cases.
