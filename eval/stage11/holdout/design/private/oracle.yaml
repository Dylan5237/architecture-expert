- id: H11-012
  primary_mode: CHANGE_REVIEW
  primary_dp: DP-003
  allowed_alternate_routes: []
  overlays:
  - runtime/concurrency
  - integration
  required_properties:
  - Complete approved review precedes recipient visibility for all included formats; supported-format capability
    is preserved.
  candidate_mechanisms:
  - Publication assumes attachment completion although the actual async model allows it later.
  - Adapter evolution bypasses the common complete-export contract; parent ownership/deadline does not enforce a
    join before publication.
  knowledge_refs:
  - principles/MP-010.md
  - principles/MP-007.md
  - principles/MP-001.md
  - failure-patterns/FP-012.md
  - tactics/T-003.md
  - question-bank/index.md#q-015
  - question-bank/index.md#q-021
  must_find:
  - Identify the proven early-publication path across a runtime ordering mechanism and independent adapter contract.
  - Before exposure, gate all included components on completed review and bind the checked result to the actual
    bytes/version served; prevent later exposure of unreviewed bytes while preserving supported formats and pending/failure
    outcomes.
  - Distinguish an actual parent owner from the missing publication-order guarantee; do not call owned jobs orphaned.
  must_not_find:
  - Treat a timeout/owner as proof that all components finish before publication.
  - Silently drop slow formats, publish unreviewed components or declare privacy/latency fundamentally incompatible.
  - Rewrite the platform when the common publication boundary can enforce completion.
  acceptable_finding_dispositions:
  - BLOCKER
  - MUST_FIX
  - HIGH_CONFIDENCE_RISK
  expected_terminal_outcomes:
  - MIN_SAFE_FIX_IDENTIFIED
  minimum_correction_expectations:
  - Use the common publication boundary to validate completion for all included components and the reviewed identity
    of the bytes served. An immutable snapshot is one sufficient implementation; safe updates under the same complete-review
    gate are also acceptable. Keep the deadline/pending policy and test delayed attachments, failure and every supported
    adapter. Compare the local boundary with wholesale pipeline replacement.
  uncertainty_expectations:
  - The fixture and code decide the violated ordering contract. Future barrier proposals must state what completion
    evidence is checked, rather than assume ordering from task ownership.
  product_contract_authority:
  - Disclosure/security product owners govern complete review and format support. Latency preference cannot silently
    drop a supported format or waive review.
  hard_failure_triggers:
    HF-05: Recommend dropping slow supported formats or early unreviewed publication without owner/conflict.
    HF-03: Invent existing all-component publication checks or deadlines that guarantee completion order.
    HF-09: Declare ARCH_CONFLICT because waiting is inconvenient despite the accepted pending/failure policy.
    HF-07: Prescribe a platform/framework as authority without showing the local boundary insufficient.
  ambiguity_notes:
  - The known owner prevents an FP-001 orphan-work accusation; the supported failure is the assumed-versus-provided
    publication order. Integration is independent adapter/recipient contract, not a second primary DP.
  scoring_notes:
    D4: Require the order/contract account; do not reward generic async-is-bad or ownership-only labels.
    D5: 'N/A: no designated compliant-form accusation.'
    D7: 'Applicable: all-format and review guarantees plus allowed pending behavior.'
    D8: 'N/A: decisive code/test evidence.'
    D9: A full-pillared supported positive finding and minimum local correction; no fabricated fundamental conflict.
