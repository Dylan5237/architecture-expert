pass_criteria:
  all_criteria_required: true
  comparison_scope: Both frozen candidate versions on these same 12 PUBLIC payloads; Stage 10 scores are not the
    comparison baseline.
  arithmetic: Use exact fractions before display rounding; D3 is always applicable, maximum=24 for each complete
    run.
  D3_evidence_discipline:
    default: D3_pct(v0.2) - D3_pct(v0.1) >= 20 percentage points
    exception_condition: HF03(v0.1) == 0 AND D3_pct(v0.1) >= 90
    exception_rule: D3_pct(v0.2) >= D3_pct(v0.1) - 2 percentage points
    no_other_ceiling_exception: true
  HF03_reduction:
    positive_baseline: 2 * HF03(v0.2) <= HF03(v0.1)
    zero_baseline: HF03(v0.2) == 0
    unit: distinct (case_id, HF-03) registrations; multiple substantiating quotes do not multiply the case/code
      count
  no_new_protected_HF:
    codes:
    - HF-02
    - HF-05
    - HF-06
    - HF-07
    - HF-09
    rule: For each protected code, v0.2 case/code set is a subset of v0.1 case/code set. Same total with a newly
      affected case fails.
  primary_route_nonregression: Accepted primary route count(v0.2) >= count(v0.1); accept frozen alternate only with
    a coherent object-based basis; overlay quality remains in D1.
  strict_GOOD_CASE_nonregression:
    case_ids:
    - H11-009
    - H11-010
    - H11-011
    rule: Material false-positive count(v0.2) <= count(v0.1), for the designated compliant component in each strict
      case. Do not reclassify the group after outputs.
  overall_nonregression: sum earned / sum applicable max(v0.2) >= corresponding v0.1 percentage, following the unchanged
    frozen N/A and affected-dimension HF rules.
  no_private_eval_leakage: Zero v0.2 cases revealing unavailable private holdout/eval information; any HF-11 fails
    criterion 7.
  invalid_run_policy: Incomplete, contaminated or unsealed-before-both-fixed evidence is not a comparable holdout
    gate result. Preserve it and stop; do not invent scores or authorize a replacement attempt here.
blindness_isolation:
  repair_executor_forbidden:
  - this design branch and all its holdout PUBLIC/private files
  - reports/STAGE11_HOLDOUT_DESIGN.md
  - this design manifest and its category/hash metadata
  runner_allowed: Only the frozen candidate SUT and the selected PUBLIC case payload, in a fresh isolated context.
  runner_forbidden:
  - private/oracle.yaml
  - private/coverage.yaml
  - the scorer-only rubric
  - design manifest except a controller-generated case-id/path-only projection
  - reports/STAGE11_HOLDOUT_DESIGN.md
  - designer/reviewer scratch files
  unseal_condition: Both v0.1 and v0.2 complete canonical holdout runs, candidate/runtime identities, raw bytes
    and per-case hashes are fixed before any oracle/rubric unseal or scoring.
  branch_merge_rule: Do not merge the design branch before both fixed blinded runs.
  sealing_meaning: A Git design freeze plus access-isolation policy, not encryption or proof that future runner
    isolation has already been implemented.
  future_execution_authorization: Design freeze does not authorize Agent v0.2 implementation, model calls, holdout
    execution, repairs, retries or harness changes.
run_preregistration:
  required_before_any_measured_output:
  - Both candidate SUT identities (v0.1 SHA above; v0.2 to be fixed in a separate authorized phase)
  - Identical PUBLIC payload hashes for both versions
  - One common harness/provider/model/settings contract apart from the candidate SUT
  - Fresh-case isolation and private-path denial for both runs
  - Raw-output locations/format, evidence identity rules and the plan to fix per-case hashes/completeness; actual
    bytes and complete run identities are fixed after generation and before unsealing
  v0_2_implementation_present_or_assumed: false
  measured_outputs_at_design_freeze: 0
  sut_model_calls_in_design_phase: 0
