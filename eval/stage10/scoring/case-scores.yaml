      evidence_pointer: eval/stage10/run/raw/E10-001.md:L60-L84
    D10:
      rationale: 限定导出、编辑持久化和相应验证，说明进一步分配热点及调度器选型不会改变决定。
      evidence_pointer: eval/stage10/run/raw/E10-001.md:L89
