      evidence_pointer: eval/stage10/run/raw/E10-001.md:L41-L47
    D2:
      rationale: 分别识别 UI 响应性和强杀不丢编辑两项已接受性质，并核对不能部署后台服务的约束。
      evidence_pointer: eval/stage10/run/raw/E10-001.md:L11-L30
    D3:
      rationale: 关键现状以 PRODUCT_INTENT/CODE/RUNTIME/TEST 标明来源和状态；内存增长的额外机制明确为 HYPOTHESIS，未据此制造独立阻断。
      evidence_pointer: eval/stage10/run/raw/E10-001.md:L48-L81
    D4:
      rationale: 以同步查询、编码和文件写入占用 UI 消息泵解释冻结，并将编辑持久化缺口与冻结暴露窗口分开。
      evidence_pointer: eval/stage10/run/raw/E10-001.md:L19-L30
    D5:
      rationale: 本案存在实质非报警组件：单进程 SQLite。明确按部署成本与进程边界资格保留它，拒绝把单进程本身报为缺陷。
      evidence_pointer: eval/stage10/run/raw/E10-001.md:L23-L30
    D6:
      rationale: 进程内后台工作、取消、进度和分页均为局部修正，并比较服务拆分；但允许有界时间间隔写入仍留下强杀丢编辑窗口。
      evidence_pointer: eval/stage10/run/raw/E10-001.md:L32-L36
    D7:
      rationale: HF-05：在明确的永不丢编辑要求下接受间隔落盘，又宣称 never edits，未取得产品取舍或升级给 owner。
      evidence_pointer: eval/stage10/run/raw/E10-001.md:L35
    D8:
      rationale: N/A：PUBLIC 的代码和运行轨迹直接确认 UI 同步工作及用户强杀丢编辑；冻结 oracle 明确 code evidence decisive，无待定根因。
      evidence_pointer: eval/stage10/public/E10-001.md:L5-L10
    D9:
      rationale: 两项 BLOCKER 各具事实、机制、失败方式、实质影响、前置 GC 排除和反证条件；全局 terminal 为 oracle 允许的 MIN_SAFE_FIX_IDENTIFIED。修正缺口单独计入
